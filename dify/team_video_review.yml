    - data:
        code: "import json\n\ndef main(body: str, status: int) -> dict:\n    if status != 200:\n        raise ValueError('视频分析失败：HTTP\
          \ ' + str(status))\n    data=json.loads(body)\n    frames=data.get('frames')\n    sheet=data.get('contact_sheet_url')\n\
          \    if not isinstance(frames,list) or not frames or not isinstance(sheet,str) or not sheet.startswith('http://host.docker.internal:8765/frames/'):\n\
          \        raise ValueError('视频没有可用的实际抽帧或联系表，请检查本机分析服务。')\n    transcript=data.get('transcript') or {}\n    context={'duration_sec':data.get('duration_sec'),\
          \ 'sampled_frames':[{'time_sec':f.get('time_sec')} for f in frames], 'transcript':transcript}\n    return {'sheet_url':sheet,'context':json.dumps(context,ensure_ascii=False)}\n"
        code_language: python3
