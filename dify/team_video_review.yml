    - data:
        code: "\"\"\"Dify 代码节点：证据受限的七维评测和人工核验。\"\"\"\nimport json\nimport math\nimport re\n\nRUBRIC = [\n    ('开头吸引力', [('opening_hook','前\
          \ 3 秒有吸引点',8,4,False), ('opening_topic','主题明确',6,3,False), ('opening_interest','有继续看下去的理由',6,3,False)]),\n    ('内容价值与故事',\
          \ [('content_value','内容有价值',8,4,True), ('content_story','故事容易理解',6,3,True), ('content_fact','内容真实可信',6,3,False)]),\n\
          \    ('画面与内容匹配', [('visual_match','画面贴合口播',6,3,True), ('visual_location','地点和场景准确',5,2,False), ('visual_appeal','画面具有吸引力',4,2,True)]),\n\
          \    ('剪辑节奏与完整度', [('editing_pace','镜头节奏',6,3,False), ('editing_sync','画面与配音衔接',5,2,False), ('editing_complete','视频完整',4,2,False)]),\n\
          \    ('配音与声音', [('sound_clear','配音清晰',4,2,False), ('sound_voice','语气与语速',3,1.5,False), ('sound_background','背景声音',3,1.5,False)]),\n\
          \    ('字幕与手机观看体验', [('subtitle_correct','字幕准确',4,2,False), ('subtitle_readable','字幕易读',3,1.5,False), ('subtitle_mobile','手机画面适配',3,1.5,False)]),\n\
          \    ('行动引导与分享意愿', [('cta_clear','行动引导清楚',4,2,False), ('cta_natural','引导自然',3,1.5,False), ('cta_share','有收藏或分享理由',3,1.5,True)]),\n\
          ]\nRULES = [('face','人脸'), ('flag','国旗'), ('competitor_logo','竞品 Logo')]\n\n\ndef _parse_model(value):\n    text\
          \ = value.strip() if isinstance(value, str) else ''\n    while text.startswith('<think>'):\n        end = text.find('</think>')\n\
          \        if end < 0:\n            return {}\n        text = text[end + 8:].strip()\n    if text.startswith('```'):\n\
          \        match = re.fullmatch(r'```(?:json)?\\s*\\n?(.*?)\\s*```', text, flags=re.S | re.I)\n        if not match:\n\
          \            return {}\n        text = match.group(1).strip()\n    try:\n        value = json.loads(text)\n    \
          \    return value if isinstance(value, dict) else {}\n    except (TypeError, ValueError):\n        return {}\n\n\
          \ndef _numeric(value):\n    return not isinstance(value, bool) and isinstance(value, (int, float)) and math.isfinite(value)\n\
          \n\ndef main(body: str, status: int, script: str, model_text: str, image_status: int, manual_review: str) -> dict:\n\
          \    try:\n        if status != 200:\n            raise ValueError('本机视频分析失败，请检查辅助服务。')\n        data = json.loads(body)\n\
          \        if not isinstance(data, dict):\n            raise ValueError('视频分析结果格式无效。')\n        frames = data.get('frames')\n\
          \        if not isinstance(frames, list) or not frames:\n            raise ValueError('没有可用的真实抽帧。')\n        times\
          \ = [f.get('time_sec') for f in frames if isinstance(f,dict) and _numeric(f.get('time_sec')) and f['time_sec'] >=\
          \ 0]\n        if not times:\n            raise ValueError('抽帧时间无效。')\n        try:\n            manual = json.loads(manual_review)\
          \ if manual_review and manual_review.strip() else {}\n        except (ValueError, TypeError):\n            raise\
          \ ValueError('人工核验必须填写有效 JSON。')\n        if not isinstance(manual, dict):\n            raise ValueError('人工核验必须为\
          \ JSON 对象。')\n        scores, risk_confirm = manual.get('scores', {}), manual.get('risk', {})\n        if not isinstance(scores,dict)\
          \ or not isinstance(risk_confirm,dict):\n            raise ValueError('人工核验的 scores 和 risk 必须是对象。')\n        known\
          \ = {item[0]: item for _, items in RUBRIC for item in items}\n        if set(scores)-set(known) or set(risk_confirm)-{r[0]\
          \ for r in RULES}:\n            raise ValueError('人工核验含未知项目，请核对项目编号。')\n        for key,value in scores.items():\n\
          \            item = known[key]\n            if not _numeric(value) or value not in (0,item[3],item[2]):\n      \
          \          raise ValueError('人工分数无效：'+key+' 只能填写 0、部分分或满分。')\n        for value in risk_confirm.values():\n    \
          \        if value not in ('found','absent','unknown'):\n                raise ValueError('风险核验只能填写 found、absent\
          \ 或 unknown。')\n        model = _parse_model(model_text) if image_status == 200 else {}\n        rows = model.get('criteria',\
          \ []) if isinstance(model.get('criteria'), list) else []\n        by_id = {r.get('id'):r for r in rows if isinstance(r,dict)}\n\
          \        transcript = data.get('transcript') if isinstance(data.get('transcript'),dict) else {}\n        transcript_text\
          \ = ' '.join(s.get('text','') for s in transcript.get('segments',[]) if isinstance(s,dict) and isinstance(s.get('text'),str))\
          \ if isinstance(transcript.get('segments'),list) else ''\n        source_text = (script or '') + '\\n' + transcript_text\n\
          \        def valid_evidence(row):\n            evidence = row.get('evidence')\n            if not isinstance(evidence,\
          \ list) or not evidence:\n                return False\n            for e in evidence:\n                if not isinstance(e,dict)\
          \ or not isinstance(e.get('observation'),str) or not e['observation'].strip():\n                    return False\n\
          \                time = e.get('time_sec')\n                quote = e.get('excerpt')\n                has_time =\
          \ _numeric(time) and any(abs(time-t)<0.15 for t in times)\n                has_quote = isinstance(quote,str) and\
          \ bool(quote.strip()) and quote in source_text\n                if not (has_time or has_quote):\n              \
          \      return False\n            return True\n        dims = []\n        for name,items in RUBRIC:\n           \
          \ out = []\n            for key,label,maximum,partial,ai in items:\n                row = by_id.get(key,{}) if ai\
          \ else {}\n                val = row.get('score')\n                valid = ai and _numeric(val) and val in (0,partial,maximum)\
          \ and valid_evidence(row)\n                if key in scores:\n                    score,source,reason = scores[key],'人工','人工评分，请保留人工观看依据。'\n\
          \                elif valid:\n                    score,source,reason = val,'AI 初评','抽样画面或转写证据，仅供人工复核。'\n      \
          \          else:\n                    score,source,reason = None,'待确认','抽样或转写不足以可靠评分，请观看完整视频并人工核验。'\n          \
          \      out.append({'id':key,'name':label,'max':maximum,'partial':partial,'score':score,'source':source,'reason':reason,'evidence':row.get('evidence',[])\
          \ if valid else [], 'suggestion':row.get('suggestion','') if valid and isinstance(row.get('suggestion',''),str)\
          \ else ''})\n            dims.append({'name':name,'max':sum(x[2] for x in items),'criteria':out})\n        model_risks\
          \ = model.get('risks',[]) if isinstance(model.get('risks'),list) else []\n        risks_by_id = {r.get('id'):r for\
          \ r in model_risks if isinstance(r,dict)}\n        risks = []\n        for key,label in RULES:\n            row=risks_by_id.get(key,{})\n\
          \            timestamp = row.get('time_sec')\n            observation = row.get('observation')\n            suspected\
          \ = row.get('status')=='suspected' and _numeric(timestamp) and any(abs(timestamp-t)<0.15 for t in times) and isinstance(observation,str)\
          \ and bool(observation.strip())\n            risks.append({'id':key,'name':label,'manual':risk_confirm.get(key,'unknown'),'ai_status':'suspected'\
          \ if suspected else 'unknown','evidence':('抽帧 '+str(timestamp)+' 秒：'+' '.join(observation.split())) if suspected\
          \ else '抽帧不能排除全片风险，需人工核验。'})\n        states=[r['manual'] for r in risks]\n        verdict = '不合格' if 'found' in\
          \ states else '待人工核验' if 'unknown' in states else '三项否决规则已人工确认未出现'\n        criteria=[c for dim in dims for c in\
          \ dim['criteria']]\n        assessed=[c for c in criteria if c['score'] is not None]\n        total=round(sum(c['score']\
          \ for c in assessed),1) if len(assessed)==len(criteria) else None\n        assessed_points=round(sum(c['score']\
          \ for c in assessed),1)\n        assessed_max=sum(c['max'] for c in assessed)\n        lines=['## 评分','总分：'+(str(total)+'\
          \ / 100' if total is not None else '待确认（已评 '+str(assessed_points)+' / '+str(assessed_max)+' 分）')]\n        suggestions=[]\n\
          \        for dim in dims:\n            lines.append('\\n'+dim['name']+'（'+str(dim['max'])+' 分）')\n            for\
          \ c in dim['criteria']:\n                lines.append(c['id']+' '+c['name']+'：'+(str(c['score'])+' / '+str(c['max'])+'（'+c['source']+'）'\
          \ if c['score'] is not None else '待确认（部分 '+str(c['partial'])+'，满分 '+str(c['max'])+'）')+'；'+c['reason'])\n      \
          \          if c['evidence']:\n                    lines.append('证据：'+json.dumps(c['evidence'],ensure_ascii=False))\n\
          \                if c['suggestion'].strip():\n                    suggestions.append(c['name']+'：'+' '.join(c['suggestion'].split()))\n\
          \        lines.append('\\nAI 只分析抽样帧及转写，未观看全片；转写可能有错误。实际音质、节奏、字幕与事实需要人工核验。分数不能预测爆款。')\n        safety=['## 安全、转人工','判定：'+verdict,'人脸、国旗或竞品\
          \ Logo 任一人工确认出现即不合格，与分数无关。']\n        labels={'found':'确认出现','absent':'确认未出现','unknown':'待确认'}\n        for r in\
          \ risks:\n            safety.append(r['name']+'：人工'+labels[r['manual']]+'；AI'+('疑似出现' if r['ai_status']=='suspected'\
          \ else '待确认')+'；'+r['evidence'])\n        safety.append('请人工观看完整视频并检查事实、素材使用权和平台规则。人工核验可在重新运行时以 JSON 提交；found=确认出现，absent=确认未出现，unknown=待确认。')\n\
          \        report='\\n'.join(lines)+'\\n\\n'+'\\n'.join(safety)\n        if suggestions:\n            report+='\\\
          n\\n## 优化建议\\n'+'\\n'.join('- '+s for s in suggestions)\n        return {'report':report}\n    except (ValueError,TypeError,KeyError,IndexError)\
          \ as exc:\n        return {'report':'## 评分\\n评测失败：'+str(exc)+'\\n\\n## 安全、转人工\\n待人工核验：评测未完成，不能确认安全。'}\n"
        code_language: python3
