        - default: '检查抽样画面是否出现可识别的人脸；发现时标记疑似风险，未发现不代表全片不存在。

            检查抽样画面是否出现任何国家或地区的国旗；发现时标记疑似风险，未发现不代表全片不存在。

            检查抽样画面中的其他品牌或平台标识；暂无竞品名单，发现后仅标记待人工确认，不能认定其为竞品。'
