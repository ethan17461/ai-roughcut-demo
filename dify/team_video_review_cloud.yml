    - id: report
      data:
        desc: ''
        selected: false
        title: 核验并计算七维评分
        type: code
        code_language: python3
        code: "\"\"\"Dify 云端代码节点：原生视频观察、转写与七维评分的证据校验。\n\nvisual_text: {\"observations\":[{\"id\":\"v1\",\"time_sec\"\
          :1.2,\"observation\":\"观察\"}],\n              \"risks\":[{\"id\":\"face\",\"status\":\"suspected\",\"\
          observation_ids\":[\"v1\"]}]}\nmodel_text: {\"criteria\":[{\"id\":\"visual_appeal\",\"score\":2,\n   \
          \          \"evidence\":[{\"observation_id\":\"v1\"}],\"suggestion\":\"建议\"}]}\n声音证据使用 {\"excerpt\":\"\
          转写原文\"}；audio_status 必须由流程确认成功后传入 ok。\n模型给出的位置只是 AI 估计，绝不冒充独立抽帧程序实际返回的时间。\n本文件可整体复制为 Dify Python3 代码节点，只依赖标准库。\n\
          \"\"\"\nimport json\nimport math\nimport re\n\n\nRUBRIC = [\n    ('开头吸引力', [('opening_hook','前 3 秒有吸引点',8,4,False),\
          \ ('opening_topic','主题明确',6,3,False), ('opening_interest','有继续看下去的理由',6,3,False)]),\n    ('内容价值与故事', [('content_value','内容有价值',8,4,True),\
          \ ('content_story','故事容易理解',6,3,True), ('content_fact','内容真实可信',6,3,False)]),\n    ('画面与内容匹配', [('visual_match','画面贴合口播',6,3,True),\
          \ ('visual_location','地点和场景准确',5,2,False), ('visual_appeal','画面具有吸引力',4,2,True)]),\n    ('剪辑节奏与完整度', [('editing_pace','镜头节奏',6,3,False),\
          \ ('editing_sync','画面与配音衔接',5,2,False), ('editing_complete','视频完整',4,2,False)]),\n    ('配音与声音', [('sound_clear','配音清晰',4,2,False),\
          \ ('sound_voice','语气与语速',3,1.5,False), ('sound_background','背景声音',3,1.5,False)]),\n    ('字幕与手机观看体验', [('subtitle_correct','字幕准确',4,2,False),\
          \ ('subtitle_readable','字幕易读',3,1.5,False), ('subtitle_mobile','手机画面适配',3,1.5,False)]),\n    ('行动引导与分享意愿',\
          \ [('cta_clear','行动引导清楚',4,2,False), ('cta_natural','引导自然',3,1.5,False), ('cta_share','有收藏或分享理由',3,1.5,True)]),\n\
          ]\nRULES = [('face','人脸'), ('flag','国旗'), ('competitor_logo','竞品 Logo')]\n\n\ndef _parse_model(value):\n\
          \    text = value.strip() if isinstance(value, str) else ''\n    while text.startswith('<think>'):\n \
          \       end = text.find('</think>')\n        if end < 0:\n            return {}\n        text = text[end\
          \ + 8:].strip()\n    if text.startswith('```'):\n        match = re.fullmatch(r'```(?:json)?\\s*\\n?(.*?)\\\
          s*```', text, flags=re.S | re.I)\n        if not match:\n            return {}\n        text = match.group(1).strip()\n\
          \    try:\n        parsed = json.loads(text)\n        return parsed if isinstance(parsed, dict) else {}\n\
          \    except (TypeError, ValueError):\n        return {}\n\n\ndef _numeric(value):\n    return not isinstance(value,\
          \ bool) and isinstance(value, (int, float)) and math.isfinite(value)\n\n\ndef _unique_rows(rows):\n  \
          \  \"\"\"重复编号的模型输出不用于自动评分，避免后写值悄悄覆盖证据。\"\"\"\n    indexed, duplicated = {}, set()\n    for row in rows\
          \ if isinstance(rows, list) else []:\n        if not isinstance(row, dict) or not isinstance(row.get('id'),\
          \ str):\n            continue\n        key = row['id']\n        if key in indexed:\n            duplicated.add(key)\n\
          \        indexed[key] = row\n    return {key: row for key, row in indexed.items() if key not in duplicated}\n\
          \n\ndef _clean_text(text):\n    return ' '.join(text.split()) if isinstance(text, str) else ''\n\n\ndef\
          \ _valid_transcript(transcript, audio_status):\n    if audio_status != 'ok' or not isinstance(transcript,\
          \ str) or not transcript.strip():\n        return ''\n    normalized = transcript.strip().lower()\n  \
          \  # audio/asr 工具目前会把这些失败作为普通 text 返回；不能算作录音内容。\n    if normalized in ('not a valid audio file', 'invalid\
          \ audio file', 'no audio file provided'):\n        return ''\n    if normalized.startswith(('error:',\
          \ 'error code:', 'traceback (most recent call last)', 'failed to transcribe')):\n        return ''\n \
          \   return transcript.strip()\n\n\ndef main(visual_text: str, transcript: str, model_text: str, manual_review:\
          \ str,\n         audio_status: str = 'unavailable') -> dict:\n    try:\n        try:\n            manual\
          \ = json.loads(manual_review) if isinstance(manual_review, str) and manual_review.strip() else {}\n  \
          \      except (ValueError, TypeError):\n            raise ValueError('人工核验必须填写有效 JSON。')\n        if not\
          \ isinstance(manual, dict):\n            raise ValueError('人工核验必须为 JSON 对象。')\n        scores, risk_confirm\
          \ = manual.get('scores', {}), manual.get('risk', {})\n        if not isinstance(scores, dict) or not isinstance(risk_confirm,\
          \ dict):\n            raise ValueError('人工核验的 scores 和 risk 必须是对象。')\n        known = {item[0]: item for\
          \ _, items in RUBRIC for item in items}\n        if set(scores) - set(known) or set(risk_confirm) - {rule[0]\
          \ for rule in RULES}:\n            raise ValueError('人工核验含未知项目，请核对项目编号。')\n        for key, value in scores.items():\n\
          \            item = known[key]\n            if not _numeric(value) or value not in (0, item[3], item[2]):\n\
          \                raise ValueError('人工分数无效：' + key + ' 只能填写 0、部分分或满分。')\n        for value in risk_confirm.values():\n\
          \            if value not in ('found', 'absent', 'unknown'):\n                raise ValueError('风险核验只能填写\
          \ found、absent 或 unknown。')\n\n        visual = _parse_model(visual_text)\n        observations = {}\n\
          \        for key, row in _unique_rows(visual.get('observations')).items():\n            time = row.get('time_sec')\n\
          \            observation = _clean_text(row.get('observation'))\n            if re.fullmatch(r'v[1-9][0-9]{0,3}',\
          \ key) and _numeric(time) and time >= 0 and observation:\n                observations[key] = {'id': key,\
          \ 'time_sec': time, 'observation': observation}\n        actual_transcript = _valid_transcript(transcript,\
          \ audio_status)\n        model_rows = _unique_rows(_parse_model(model_text).get('criteria'))\n\n     \
          \   def validated_evidence(key, row):\n            evidence = row.get('evidence')\n            if not\
          \ isinstance(evidence, list) or not evidence:\n                return []\n            out, visual_seen,\
          \ audio_seen = [], False, False\n            for item in evidence:\n                if not isinstance(item,\
          \ dict):\n                    return []\n                observation_id = item.get('observation_id')\n\
          \                excerpt = item.get('excerpt')\n                # 每条证据只能引用一种来源，避免无效引用被另一字段掩盖。\n      \
          \          if isinstance(observation_id, str) and excerpt is None and observation_id in observations:\n\
          \                    observed = observations[observation_id]\n                    out.append('视频 AI 观察\
          \ ' + observation_id + '；AI 估计位置 ' + str(observed['time_sec'])\n                               + ' 秒（待复核）：'\
          \ + observed['observation'])\n                    visual_seen = True\n                elif observation_id\
          \ is None and isinstance(excerpt, str) and excerpt.strip() and actual_transcript and excerpt in actual_transcript:\n\
          \                    out.append('实际音轨转写摘录（转写可能有误）：' + _clean_text(excerpt))\n                    audio_seen\
          \ = True\n                else:\n                    return []\n            if key == 'visual_match' and\
          \ not (visual_seen and audio_seen):\n                return []\n            if key == 'visual_appeal'\
          \ and not visual_seen:\n                return []\n            return out\n\n        dims = []\n     \
          \   for name, items in RUBRIC:\n            criteria = []\n            for key, label, maximum, partial,\
          \ ai in items:\n                row = model_rows.get(key, {}) if ai else {}\n                evidence\
          \ = validated_evidence(key, row) if ai else []\n                val = row.get('score')\n             \
          \   valid = bool(evidence) and _numeric(val) and val in (0, partial, maximum)\n                if key\
          \ in scores:\n                    score, source, reason = scores[key], '人工', '人工评分，请保留人工观看依据。'\n     \
          \           elif valid:\n                    score, source, reason = val, 'AI 初评', '依据原视频的 AI 观察或实际音轨转写，仅供人工复核。'\n\
          \                else:\n                    score, source, reason = None, '待确认', '现有证据不足，请观看完整视频并人工核验。'\n\
          \                criteria.append({'id': key, 'name': label, 'max': maximum, 'partial': partial,\n    \
          \                             'score': score, 'source': source, 'reason': reason,\n                  \
          \               'evidence': evidence if valid else [],\n                                 'suggestion':\
          \ _clean_text(row.get('suggestion')) if valid else ''})\n            dims.append({'name': name, 'max':\
          \ sum(item[2] for item in items), 'criteria': criteria})\n\n        visual_risks = _unique_rows(visual.get('risks'))\n\
          \        risks = []\n        for key, label in RULES:\n            row = visual_risks.get(key, {})\n \
          \           ids = row.get('observation_ids')\n            suspected = (row.get('status') == 'suspected'\
          \ and isinstance(ids, list) and bool(ids)\n                         and all(isinstance(ref, str) and ref\
          \ in observations for ref in ids))\n            evidence = []\n            if suspected:\n           \
          \     for ref in dict.fromkeys(ids):\n                    observed = observations[ref]\n             \
          \       evidence.append('AI 估计位置 ' + str(observed['time_sec']) + ' 秒（待复核）：' + observed['observation'])\n\
          \            risks.append({'id': key, 'name': label, 'manual': risk_confirm.get(key, 'unknown'),\n   \
          \                       'suspected': bool(suspected), 'evidence': evidence})\n\n        states = [risk['manual']\
          \ for risk in risks]\n        verdict = ('不合格' if 'found' in states else '待人工核验' if 'unknown' in states\n\
          \                   else '三项否决规则已人工确认未出现')\n        all_criteria = [c for dim in dims for c in dim['criteria']]\n\
          \        assessed = [c for c in all_criteria if c['score'] is not None]\n        points = round(sum(c['score']\
          \ for c in assessed), 1)\n        maximum = sum(c['max'] for c in assessed)\n        total = str(points)\
          \ + ' / 100' if len(assessed) == len(all_criteria) else '待确认（已评 ' + str(points) + ' / ' + str(maximum)\
          \ + ' 分）'\n        lines = ['## 评分', '总分：' + total]\n        suggestions = []\n        for dim in dims:\n\
          \            lines.append('\\n' + dim['name'] + '（' + str(dim['max']) + ' 分）')\n            for criterion\
          \ in dim['criteria']:\n                value = (str(criterion['score']) + ' / ' + str(criterion['max'])\
          \ + '（' + criterion['source'] + '）'\n                         if criterion['score'] is not None else '待确认（部分\
          \ ' + str(criterion['partial']) + '，满分 ' + str(criterion['max']) + '）')\n                lines.append(criterion['id']\
          \ + ' ' + criterion['name'] + '：' + value + '；' + criterion['reason'])\n                lines.extend('证据：'\
          \ + evidence for evidence in criterion['evidence'])\n                if criterion['suggestion']:\n   \
          \                 suggestions.append(criterion['name'] + '：' + criterion['suggestion'])\n        lines.append('\\\
          n视频模型可能抽样分析并遗漏画面；所列时间为 AI 估计，未经独立抽帧核对，不能据此确认全片安全。实际音质、节奏、字幕与事实仍需人工核验，分数不能预测爆款。')\n        if not actual_transcript:\n\
          \            lines.append('本次没有可用的实际音轨转写，画面与口播匹配等待人工核验；未用预写脚本冒充录音内容。')\n        safety = ['## 安全、转人工',\
          \ '判定：' + verdict, '人脸、国旗或竞品 Logo 任一人工确认出现即不合格，与分数无关。']\n        labels = {'found': '确认出现', 'absent':\
          \ '确认未出现', 'unknown': '待确认'}\n        for risk in risks:\n            evidence = '；'.join(risk['evidence'])\
          \ if risk['evidence'] else '视频 AI 未提供可定位的疑似证据，不能据此认定全片不存在。'\n            safety.append(risk['name'] +\
          \ '：人工' + labels[risk['manual']] + '；AI'\n                          + ('疑似出现' if risk['suspected'] else\
          \ '待确认') + '；' + evidence)\n        safety.append('暂无竞品名单时，疑似品牌标识仍需人工确认是否属于竞品。请人工观看完整视频并检查事实、素材使用权和平台规则。人工核验\
          \ JSON 中 found=确认出现，absent=确认未出现，unknown=待确认。')\n        report = '\\n'.join(lines) + '\\n\\n' + '\\n'.join(safety)\n\
          \        if suggestions:\n            report += '\\n\\n## 优化建议\\n' + '\\n'.join('- ' + suggestion for\
          \ suggestion in suggestions)\n        return {'report': report}\n    except (ValueError, TypeError, KeyError,\
          \ IndexError) as exc:\n        return {'report': '## 评分\\n评测失败：' + str(exc) + '\\n\\n## 安全、转人工\\n待人工核验：评测未完成，不能确认安全。'}\n"
