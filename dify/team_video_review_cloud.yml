    - id: asr_submit
      data:
        desc: ''
        selected: false
        title: 提交实际视频音轨转写
        type: http-request
        authorization:
          type: no-auth
        body:
          type: json
          data:
          - id: 3b625f81-550c-5af4-951d-44a0b1e14cf2
            key: ''
            type: text
            value: '{{#asr_prepare.request_body#}}'
        default_value:
        - key: body
          type: string
          value: ''
        - key: status_code
          type: number
          value: 0
        - key: headers
          type: object
          value: '{}'
        - key: files
          type: array[file]
          value: '[]'
        error_strategy: default-value
        headers: 'Authorization: Bearer {{#env.DASHSCOPE_API_KEY#}}

          Content-Type: application/json

          X-DashScope-Async: enable'
        method: post
        params: ''
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 1000
        ssl_verify: true
        timeout:
          connect: 10
          read: 30
          write: 30
        url: '{{#asr_prepare.submit_url#}}'
      position:
        x: 1300
        y: 300
      positionAbsolute:
        x: 1300
        y: 300
      height: 120
      width: 244
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      zIndex: 0
