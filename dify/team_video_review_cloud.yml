    - id: asr_poll_parse
      data:
        desc: ''
        selected: false
        title: 校验转写结果地址
        type: code
        code_language: python3
        code: "\"\"\"Pure parsing/validation helpers embedded in cloud Dify code nodes (no network).\"\"\"\nimport\
          \ json\nimport re\nfrom urllib.parse import urlsplit\n\n\ndef _object(text):\n    try:\n        value\
          \ = json.loads(text)\n        return value if isinstance(value, dict) else {}\n    except (ValueError,\
          \ TypeError):\n        return {}\n\n\ndef prepare_request(video_url: str, language: str, base_url: str)\
          \ -> dict:\n    out = {'ready': 0, 'submit_url': '', 'base_url': '', 'request_body': '{}'}\n    try:\n\
          \        base = urlsplit(base_url.rstrip('/'))\n        media = urlsplit(video_url)\n        allowed_base\
          \ = (base.hostname == 'dashscope.aliyuncs.com'\n                        or bool(re.fullmatch(r'[a-z0-9-]+\\\
          .cn-beijing\\.maas\\.aliyuncs\\.com', base.hostname or '')))\n        if (base.scheme != 'https' or not\
          \ allowed_base or base.port not in (None, 443)\n                or base.username or base.password or base.query\
          \ or base.fragment\n                or base.path not in ('', '/api/v1')):\n            return out\n  \
          \      if (media.scheme != 'https' or not media.hostname or media.username or media.password\n       \
          \         or media.hostname in ('localhost', 'host.docker.internal') or media.fragment):\n           \
          \ return out\n        base_normalized = 'https://' + base.netloc + '/api/v1'\n    except (TypeError, ValueError,\
          \ AttributeError):\n        return out\n    payload = {'model': 'paraformer-v2', 'input': {'file_urls':\
          \ [video_url]},\n               'parameters': {'language_hints': ['zh' if language == 'zh-CN' else 'en']}}\n\
          \    return {'ready': 1, 'submit_url': base_normalized + '/services/audio/asr/transcription',\n      \
          \      'base_url': base_normalized, 'request_body': json.dumps(payload, ensure_ascii=False)}\n\n\ndef\
          \ parse_submission(body: str, status: int, base_url: str) -> dict:\n    result = {'ready': 0, 'task_id':\
          \ '', 'poll_url': ''}\n    data = _object(body)\n    output = data.get('output')\n    if status != 200\
          \ or not isinstance(output, dict) or data.get('code'):\n        return result\n    task_id = output.get('task_id')\n\
          \    if not isinstance(task_id, str) or not re.fullmatch(r'[A-Za-z0-9_-]{8,100}', task_id):\n        return\
          \ result\n    if output.get('task_status') not in ('PENDING', 'RUNNING', 'SUCCEEDED'):\n        return\
          \ result\n    return {'ready': 1, 'task_id': task_id, 'poll_url': base_url + '/tasks/' + task_id}\n\n\n\
          def parse_poll(body: str, status: int) -> dict:\n    failed = {'done': 1, 'result_url': '', 'poll_status':\
          \ 'unavailable'}\n    data = _object(body)\n    output = data.get('output')\n    if status != 200 or not\
          \ isinstance(output, dict) or data.get('code'):\n        return failed\n    state = output.get('task_status')\n\
          \    if state in ('PENDING', 'RUNNING'):\n        return {'done': 0, 'result_url': '', 'poll_status':\
          \ 'pending'}\n    if state != 'SUCCEEDED':\n        return failed\n    rows = output.get('results')\n\
          \    if not isinstance(rows, list) or len(rows) != 1 or not isinstance(rows[0], dict):\n        return\
          \ failed\n    row = rows[0]\n    if row.get('subtask_status') != 'SUCCEEDED':\n        return failed\n\
          \    result_url = row.get('transcription_url')\n    try:\n        parsed = urlsplit(result_url)\n    \
          \    # Signed ASR transcripts are on Alibaba OSS; never fetch arbitrary response URLs.\n        if (not\
          \ isinstance(result_url, str) or parsed.scheme != 'https'\n                or not (parsed.hostname or\
          \ '').endswith('.aliyuncs.com')\n                or parsed.username or parsed.password or parsed.port\
          \ not in (None, 443)\n                or not parsed.path or parsed.fragment):\n            return failed\n\
          \    except (ValueError, TypeError, AttributeError):\n        return failed\n    return {'done': 1, 'result_url':\
          \ result_url, 'poll_status': 'succeeded'}\n\n\ndef parse_result(body: str, status: int, extracted_texts:\
          \ list = None) -> dict:\n    unavailable = {'audio': json.dumps({'transcript': '', 'audio_status': 'unavailable'},\
          \ ensure_ascii=False)}\n    if status != 200:\n        return unavailable\n    # Dify HTTP turns Content-Disposition\
          \ JSON attachments into files rather than body.\n    # Preserve ordinary JSON body responses; only a single\
          \ extracted attachment is valid.\n    payload = body.strip() if isinstance(body, str) else ''\n    if\
          \ not payload:\n        if (not isinstance(extracted_texts, list) or len(extracted_texts) != 1\n     \
          \           or not isinstance(extracted_texts[0], str) or not extracted_texts[0].strip()):\n         \
          \   return unavailable\n        payload = extracted_texts[0].strip()\n    data = _object(payload)\n  \
          \  if data.get('code') or not isinstance(data.get('transcripts'), list):\n        return unavailable\n\
          \    parts = []\n    for row in data['transcripts']:\n        if not isinstance(row, dict) or not isinstance(row.get('text'),\
          \ str):\n            return unavailable\n        if row['text'].strip():\n            parts.append(row['text'].strip())\n\
          \    text = '\\n'.join(parts)\n    if not text or text.lower() == 'not a valid audio file':\n        return\
          \ unavailable\n    return {'audio': json.dumps({'transcript': text, 'audio_status': 'ok'}, ensure_ascii=False)}\n\
          \n\ndef unpack_audio(audio: str) -> dict:\n    data = _object(audio)\n    transcript = data.get('transcript')\n\
          \    status = data.get('audio_status')\n    if status != 'ok' or not isinstance(transcript, str) or not\
          \ transcript.strip():\n        return {'transcript': '', 'audio_status': 'unavailable'}\n    return {'transcript':\
          \ transcript, 'audio_status': 'ok'}\n\nmain = parse_poll\n"
